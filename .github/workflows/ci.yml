name: CI

'on':
  pull_request:
    branches: [main, master]
  push:
    branches:
      - '**'
      - '!main'
      - '!master'

jobs:
  build-check:
    name: Сборка (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Конфигурация
        shell: pwsh
        run: cmake -B build -S native -G Ninja "-DCMAKE_BUILD_TYPE=${{ matrix.config }}"

      - name: Сборка
        shell: pwsh
        run: cmake --build build --parallel

  commit-lint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить формат коммитов
        run: |
          FAILED=0
          while read -r MSG; do
            [ -z "$MSG" ] && continue
            if ! echo "$MSG" | grep -qE '^(feat|fix|perf|docs|style|refactor|test|chore|ci)(\(.+\))?!?: .+'; then
              echo "::error::Некорректный формат коммита: $MSG (нужен префикс feat/fix/perf/docs/chore/…)"
              FAILED=1
            fi
          done < <(git log ${{ github.event.pull_request.base.sha }}..HEAD --pretty=format:"%s")
          exit $FAILED
